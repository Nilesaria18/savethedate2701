<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date | Rushali & Nilesh</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- The persistent Taxi that stays on screen -->
  <div id="taxi-container">
    <div class="taxi">
      <div class="taxi-body"></div>
      <div class="wheel wheel-front"></div>
      <div class="wheel wheel-back"></div>
    </div>
  </div>

  <!-- The main pinning container -->
  <div id="scroll-track">
    <div id="horizontal-scenes">
      
      <!-- Scene 1: The Map Intro -->
      <section class="scene" id="scene-map">
        <div class="map-content">
          <h1>Rushali & Nilesh</h1>
          <p>Scroll to begin the journey</p>
        </div>
      </section>

      <!-- Scene 2: Howrah Bridge -->
      <section class="scene" id="scene-howrah">
        <div class="background-layer sky-blue"></div>
        <div class="landmark">HOWRAH BRIDGE</div>
        <div class="road"></div>
      </section>

      <!-- Scene 3: Victoria Memorial -->
      <section class="scene" id="scene-victoria">
        <div class="background-layer cream"></div>
        <div class="landmark">VICTORIA MEMORIAL</div>
        <div class="road"></div>
      </section>

      <!-- Scene 4: Jadavpur University -->
      <section class="scene" id="scene-ju">
        <div class="background-layer earth"></div>
        <div class="landmark">JADAVPUR UNIVERSITY</div>
        <div class="road"></div>
      </section>

      <!-- Scene 5: The Doors & Reveal -->
      <section class="scene" id="scene-doors">
        <div class="door-frame">
          <div class="door left-door"></div>
          <div class="door right-door"></div>
          <div class="reveal-content">
            <h2>Save the Date</h2>
            <p>25 & 26 January, 2027</p>
            <p>Kolkata</p>
            <button class="rsvp-btn">RSVP Now</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
